name: License checker

on:
  push:
    branches:
      - main
      - release/*
      - develop
    paths-ignore:
      - '**.md'
  pull_request:
    branches:
      - main
      - release/*
      - develop
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-license:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout codes
        uses: actions/checkout@v4
      - name: Check License Header
        uses: apache/skywalking-eyes@v0.4.0
