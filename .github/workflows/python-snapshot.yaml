name: Snapshot-Python

on:
  push:
    branches:
      - main
      - release/*
      - develop
    paths:
      - 'src/**'
      - 'tests/**'
      - 'examples/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/python-snapshot.yaml'
      - '!src/**.md'
      - '!tests/**.md'
      - '!examples/**.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-snapshot:
    name: Check development version
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/develop' ||
      startsWith(github.ref, 'refs/heads/release/')
    runs-on: ubuntu-latest
    outputs:
      IS_SNAPSHOT: ${{ steps.check_version.outputs.IS_SNAPSHOT }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Check package version
        id: check_version
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import os
          import runpy
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          package_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))[
              "project"
          ]["version"]
          module_version = runpy.run_path("src/polaris_ai/__init__.py")["__version__"]
          if package_version != module_version:
              raise SystemExit(
                  f"pyproject version {package_version!r} does not match "
                  f"polaris_ai.__version__ {module_version!r}"
              )
          configured = Version(package_version)
          is_snapshot = configured.dev is not None
          if is_snapshot and configured.local is not None:
              raise SystemExit("PyPI development releases must not have a local version label")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"IS_SNAPSHOT={str(is_snapshot).lower()}", file=output)
          print(f"{configured}: snapshot={is_snapshot}")
          PY

  build:
    name: Build and verify development distributions
    needs: check-snapshot
    if: ${{ needs.check-snapshot.outputs.IS_SNAPSHOT == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout polaris-python-ai
        uses: actions/checkout@v4
        with:
          path: polaris-python-ai
      - name: Checkout polaris-python
        uses: actions/checkout@v4
        with:
          repository: polaris-contrib/polaris-python
          path: polaris-python
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Verify lockfile
        working-directory: polaris-python-ai
        run: uv lock --check
      - name: Set development version
        id: version
        working-directory: polaris-python-ai
        run: |
          uv run --no-project --with packaging python - <<'PY'
          import ast
          import os
          import tomllib
          from pathlib import Path

          from packaging.version import Version

          pyproject = Path("pyproject.toml")
          init = Path("src/polaris_ai/__init__.py")
          package_text = pyproject.read_text(encoding="utf-8")
          package_version = tomllib.loads(package_text)["project"]["version"]
          init_text = init.read_text(encoding="utf-8")
          assignments = [
              node for node in ast.parse(init_text).body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__"
                      for target in node.targets)
          ]
          if len(assignments) != 1 or len(assignments[0].targets) != 1:
              raise SystemExit(f"expected one __version__ assignment in {init}")
          assignment = assignments[0]
          module_version = ast.literal_eval(assignment.value)
          if package_version != module_version:
              raise SystemExit(
                  f"pyproject version {package_version!r} does not match "
                  f"polaris_ai.__version__ {module_version!r}"
              )
          configured = Version(package_version)
          if configured.dev is None or configured.local is not None:
              raise SystemExit(f"{configured} is not a public development version")
          run_number = int(os.environ["GITHUB_RUN_NUMBER"])
          if run_number <= 0:
              raise SystemExit("GITHUB_RUN_NUMBER must be positive")
          base = str(configured).rsplit(".dev", 1)[0]
          version = str(Version(f"{base}.dev{run_number}"))
          pyproject.write_text(
              package_text.replace(f'version = "{package_version}"', f'version = "{version}"', 1),
              encoding="utf-8",
          )
          init_lines = init_text.splitlines(keepends=True)
          init_lines[assignment.lineno - 1:assignment.end_lineno] = [
              f'__version__ = "{version}"\n'
          ]
          init.write_text("".join(init_lines), encoding="utf-8")
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              print(f"VERSION={version}", file=output)
          print(f"{configured} -> {version}")
          PY
      - name: Build core SDK dependency
        working-directory: polaris-python
        run: uv build
      - name: Build distributions
        working-directory: polaris-python-ai
        run: uv build
      - name: Create clean wheel environment
        run: uv venv "$RUNNER_TEMP/polaris-ai-snapshot-venv" --python 3.12
      - name: Install wheel with dependencies
        run: |
          uv pip install --python "$RUNNER_TEMP/polaris-ai-snapshot-venv/bin/python" \
            polaris-python/dist/*.whl
          wheel="$(ls polaris-python-ai/dist/*.whl)"
          uv pip install --python "$RUNNER_TEMP/polaris-ai-snapshot-venv/bin/python" \
            "${wheel}[agentscope,a2a,mcp]" \
            "pytest>=8.3,<9"
      - name: Verify installed distribution
        working-directory: ${{ runner.temp }}
        env:
          SNAPSHOT_VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          "$RUNNER_TEMP/polaris-ai-snapshot-venv/bin/python" - <<'PY'
          import os
          import sys
          from importlib.metadata import requires, version
          from pathlib import Path

          import polaris_ai
          from polaris_ai.a2a import A2ATransport, PolarisA2ARegistrar, PolarisA2AResolver
          from polaris_ai.agentscope import PolarisAgentConfig

          assert version("polaris-python-ai") == polaris_ai.__version__ == os.environ["SNAPSHOT_VERSION"]
          assert Path(polaris_ai.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert any(
              item.startswith("polaris-python") and "../polaris-python" not in item
              for item in requires("polaris-python-ai") or ()
          )
          assert A2ATransport and PolarisA2ARegistrar and PolarisA2AResolver
          assert PolarisAgentConfig.from_env({}).namespace == "default"
          print(f"verified polaris-python-ai {polaris_ai.__version__} from {polaris_ai.__file__}")
          PY
      - name: Run tests against installed wheel
        working-directory: polaris-python-ai
        env:
          POLARIS_PYTHON: ${{ runner.temp }}/polaris-ai-snapshot-venv/bin/python
        run: |
          "$RUNNER_TEMP/polaris-ai-snapshot-venv/bin/python" -m pytest tests -q
      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: polaris-python-ai-snapshot-dist
          path: polaris-python-ai/dist/
          if-no-files-found: error

  publish:
    name: Publish development package to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: Release
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: polaris-python-ai-snapshot-dist
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          print-hash: true
          # Reruns keep the same run number and package version.
          skip-existing: true
