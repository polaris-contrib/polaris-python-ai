name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, for example polaris-python-ai==0.0.1
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout polaris-python-ai
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: polaris-python-ai
      - name: Checkout polaris-python
        uses: actions/checkout@v4
        with:
          repository: polaris-contrib/polaris-python
          path: polaris-python
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Verify lockfile
        working-directory: polaris-python-ai
        run: uv lock --check
      - name: Verify release version
        working-directory: polaris-python-ai
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          uv run --no-project python - <<'PY'
          import ast
          import os
          from pathlib import Path

          about = Path("src/polaris_ai/_version.py")
          assignments = [
              node for node in ast.parse(about.read_text(encoding="utf-8")).body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == "__version__"
                      for target in node.targets)
          ]
          if len(assignments) != 1:
              raise SystemExit(f"expected one __version__ assignment in {about}")
          package_version = ast.literal_eval(assignments[0].value)
          expected = f"polaris-python-ai=={package_version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"release tag {os.environ['RELEASE_TAG']!r} must be {expected!r}"
              )
          print(f"Releasing {expected}")
          PY
      - name: Build core SDK dependency
        working-directory: polaris-python
        run: uv build
      - name: Build distributions
        working-directory: polaris-python-ai
        run: uv build
      - name: Create clean wheel environment
        run: uv venv "$RUNNER_TEMP/polaris-ai-release-venv" --python 3.12
      - name: Install verified wheel
        run: |
          uv pip install --python "$RUNNER_TEMP/polaris-ai-release-venv/bin/python" \
            polaris-python/dist/*.whl
          wheel="$(ls polaris-python-ai/dist/*.whl)"
          uv pip install --python "$RUNNER_TEMP/polaris-ai-release-venv/bin/python" \
            "${wheel}[all]" \
            "pytest>=8.3,<9" \
            "pytest-cov>=6,<8" \
            "uvicorn>=0.30,<1" \
            "a2a-sdk[fastapi]>=1.2.3,<2"
      - name: Verify installed distribution
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/polaris-ai-release-venv/bin/python" - <<'PY'
          import sys
          from importlib.metadata import packages_distributions, requires, version
          from pathlib import Path

          import polaris_ai
          import polaris_ai.a2a
          import polaris_ai.agentscope
          import polaris_ai.langgraph

          assert version("polaris-python-ai") == polaris_ai.__version__
          assert polaris_ai.a2a.__version__ == polaris_ai.__version__
          assert polaris_ai.agentscope.__version__ == polaris_ai.__version__
          assert polaris_ai.langgraph.__version__ == polaris_ai.__version__
          assert packages_distributions()["polaris_ai"] == ["polaris-python-ai"]
          assert Path(polaris_ai.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert not any("file://" in item for item in requires("polaris-python-ai") or ())
          print(f"verified polaris-python-ai {polaris_ai.__version__}")
          PY
      - name: Run tests against installed wheel
        working-directory: polaris-python-ai
        run: |
          "$RUNNER_TEMP/polaris-ai-release-venv/bin/python" -m pytest tests -q
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: polaris-python-ai-release-dist
          path: polaris-python-ai/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: polaris-python-ai-release-dist
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
          attestations: true
