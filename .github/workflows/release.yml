name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout polaris-python-ai
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          path: polaris-python-ai
      - name: Checkout polaris-python
        uses: actions/checkout@v4
        with:
          repository: polaris-contrib/polaris-python
          path: polaris-python
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - name: Verify lockfile
        working-directory: polaris-python-ai
        run: uv lock --check
      - name: Verify release version
        working-directory: polaris-python-ai
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          package_version="$(python3 - <<'PY'
          import runpy
          import tomllib
          from pathlib import Path

          pyproject_version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))[
              "project"
          ]["version"]
          module_version = runpy.run_path("src/polaris_ai/__init__.py")["__version__"]
          if pyproject_version != module_version:
              raise SystemExit(
                  f"pyproject version {pyproject_version!r} does not match "
                  f"polaris_ai.__version__ {module_version!r}"
              )
          print(pyproject_version)
          PY
          )"
          tag_version="${RELEASE_TAG#v}"
          tag_version="${tag_version#polaris-python-ai==}"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Release tag '$RELEASE_TAG' does not match package version '$package_version'." >&2
            exit 1
          fi
          echo "Releasing polaris-python-ai $package_version"
      - name: Build core SDK dependency
        working-directory: polaris-python
        run: uv build
      - name: Build distributions
        working-directory: polaris-python-ai
        run: uv build
      - name: Create clean wheel environment
        run: uv venv "$RUNNER_TEMP/polaris-ai-release-venv" --python 3.12
      - name: Install wheel with dependencies
        run: |
          uv pip install --python "$RUNNER_TEMP/polaris-ai-release-venv/bin/python" \
            polaris-python/dist/*.whl
          wheel="$(ls polaris-python-ai/dist/*.whl)"
          uv pip install --python "$RUNNER_TEMP/polaris-ai-release-venv/bin/python" \
            "${wheel}[agentscope,a2a,mcp]" \
            "pytest>=8.3,<9"
      - name: Verify installed distribution
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/polaris-ai-release-venv/bin/python" - <<'PY'
          import sys
          from importlib.metadata import requires, version
          from pathlib import Path

          import polaris_ai
          from polaris_ai.a2a import A2ATransport, PolarisA2ARegistrar, PolarisA2AResolver
          from polaris_ai.agentscope import PolarisAgentConfig

          assert version("polaris-python-ai") == polaris_ai.__version__
          assert Path(polaris_ai.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert any(
              item.startswith("polaris-python") and "../polaris-python" not in item
              for item in requires("polaris-python-ai") or ()
          )
          assert A2ATransport and PolarisA2ARegistrar and PolarisA2AResolver
          assert PolarisAgentConfig.from_env({}).namespace == "default"
          print(f"verified polaris-python-ai {polaris_ai.__version__} from {polaris_ai.__file__}")
          PY
      - name: Run tests against installed wheel
        working-directory: polaris-python-ai
        env:
          POLARIS_PYTHON: ${{ runner.temp }}/polaris-ai-release-venv/bin/python
        run: |
          "$RUNNER_TEMP/polaris-ai-release-venv/bin/python" -m pytest tests -q
      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: polaris-python-ai-release-dist
          path: polaris-python-ai/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@v4
        with:
          name: polaris-python-ai-release-dist
          path: dist/
      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
          print-hash: true
