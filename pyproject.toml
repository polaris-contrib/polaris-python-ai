[project]
name = "polaris-python-ai"
dynamic = ["version"]
description = "Polaris integrations for Python AI frameworks."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = ["polaris-python>=0.0.1.dev0,<0.1"]

[project.optional-dependencies]
a2a = ["a2a-sdk>=1.2.3,<2"]
agentscope = [
    "a2a-sdk>=1.2.3,<2",
    "agentscope>=2.0.10,<3",
]
langgraph = ["langgraph>=1.0,<2"]
mcp = [
    "a2a-sdk>=1.2.3,<2",
    "agentscope>=2.0.10,<3",
    "mcp>=2,<3",
]
all = [
    "a2a-sdk>=1.2.3,<2",
    "agentscope>=2.0.10,<3",
    "langgraph>=1.0,<2",
    "mcp>=2,<3",
]

[project.urls]
Homepage = "https://github.com/polaris-contrib/polaris-python-ai"
Repository = "https://github.com/polaris-contrib/polaris-python-ai"
Issues = "https://github.com/polaris-contrib/polaris-python-ai/issues"
Documentation = "https://github.com/polaris-contrib/polaris-python-ai#readme"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "build>=1,<2",
    "uvicorn>=0.30,<1",
    "a2a-sdk[fastapi]>=1.2.3,<2",
]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv.sources]
polaris-python = { path = "../polaris-python", editable = true }

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.setuptools.dynamic]
version = { attr = "polaris_ai._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
